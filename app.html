<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FermentWatch - sourdough timing that knows your kitchen</title>
<style>
  :root { --ink:#2e2618; --muted:#837a68; --accent:#b25e1e; --accent-dk:#8f4a15; --card:#ffffff; --bg:#faf6ef; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:680px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0 0 6px; }
  .tag { color:var(--muted); margin:0 0 20px; line-height:1.45; }
  .card { background:var(--card); border:1px solid #ece2d0; border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  input { padding:9px 10px; border:1px solid #ddd2bd; border-radius:8px; font-size:15px; background:#fff; }
  input[type=number] { width:110px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button:hover { background:var(--accent-dk); }
  button.ghost { background:#f2e9d8; color:var(--ink); }
  button.ghost:hover { background:#e7dbc4; }
  .hero { text-align:center; }
  .pill { display:inline-block; padding:4px 14px; border-radius:999px; font-size:13px; font-weight:700; background:#e2f0e6; color:#2f6f45; }
  .pill.done { background:#f6ecd2; color:#8a6a14; }
  .hero .big { font-size:30px; font-weight:700; margin:8px 0 2px; }
  .hero .sub { color:var(--muted); font-size:14.5px; line-height:1.5; }
  .bar { height:8px; background:#f2e9d8; border-radius:99px; overflow:hidden; margin:12px 0 2px; }
  .bar i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .stage { display:flex; gap:14px; padding:12px 4px; border-bottom:1px solid #f0e7d5; }
  .stage:last-child { border-bottom:0; }
  .stage .t { width:130px; flex-shrink:0; color:var(--muted); font-size:14px; padding-top:2px; }
  .stage .nm { font-weight:700; font-size:15.5px; }
  .stage .nt { color:var(--muted); font-size:13.5px; margin-top:2px; line-height:1.45; }
  .stage .dur { margin-left:auto; flex-shrink:0; color:var(--muted); font-size:13.5px; padding-top:2px; }
  .stage.now { background:#fbf3e4; border-radius:10px; padding-left:10px; padding-right:10px; }
  .stage.now .nm::after { content:' - now'; color:var(--accent-dk); font-size:12.5px; }
  .stage.past { opacity:.5; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FermentWatch</h1>
  <p class="tag">Sourdough recipes assume a 24C kitchen. Yours is not 24C. FermentWatch rebuilds the whole bake-day schedule around your actual room temperature - warmer kitchen, faster dough, real clock times for every stage.</p>

  <div class="card" id="setupCard">
    <div class="row">
      <div><label for="temp">Kitchen temperature (C)</label><input type="number" id="temp" value="22" min="5" max="40" step="0.5"></div>
      <button id="startBtn">Start a bake now</button>
      <button id="resetBtn" class="ghost hidden">Reset</button>
    </div>
  </div>

  <div class="card hero hidden" id="heroCard">
    <span class="pill" id="pill">bulk ferment</span>
    <div class="big" id="heroBig">ends 8:40 PM</div>
    <div class="sub" id="heroSub"></div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
  </div>

  <div class="card hidden" id="schedCard"><div id="sched"></div></div>
</div>
<script src="engine.js"></script>
<script>
(function(){
  var E = FermentWatchEngine;
  var KEY = 'fermentwatch.v1';
  var st = {temp:22, startMs:null};
  try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) st = s; } catch(e){}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function render(){
    $('temp').value = st.temp;
    $('resetBtn').classList.toggle('hidden', !st.startMs);
    if (!st.startMs){ $('heroCard').classList.add('hidden'); $('schedCard').classList.add('hidden'); return; }
    var sched = E.schedule(st.startMs, parseFloat(st.temp));
    var now = Date.now();
    var idx = E.currentStage(now, sched);
    $('heroCard').classList.remove('hidden');
    $('schedCard').classList.remove('hidden');
    if (idx === -1){
      $('pill').textContent = 'bake complete';
      $('pill').className = 'pill done';
      $('heroBig').textContent = 'Enjoy the bread';
      $('heroSub').textContent = 'All stages finished. Let it cool at least an hour before slicing.';
    } else {
      var c = sched[idx];
      $('pill').textContent = c.name.toLowerCase();
      $('pill').className = 'pill';
      $('heroBig').textContent = 'ends ' + E.fmtClock(c.endMs);
      $('heroSub').textContent = c.note + ' Next up at ' + E.fmtClock(c.endMs) + (idx + 1 < sched.length ? ': ' + sched[idx + 1].name.toLowerCase() + '.' : '.');
    }
    $('barFill').style.width = E.progress(now, sched) + '%';
    var html = '';
    sched.forEach(function(s, i){
      var cls = i < idx || idx === -1 ? 'past' : (i === idx ? 'now' : '');
      html += '<div class="stage ' + cls + '">' +
        '<div class="t">' + E.fmtClock(s.startMs) + ' - ' + E.fmtClock(s.endMs) + '</div>' +
        '<div><div class="nm">' + esc(s.name) + '</div><div class="nt">' + esc(s.note) + '</div></div>' +
        '<div class="dur">' + E.fmtDur(s.hours) + '</div>' +
      '</div>';
    });
    $('sched').innerHTML = html;
  }

  $('startBtn').addEventListener('click', function(){
    var t = parseFloat($('temp').value);
    if (!isFinite(t) || t < 5 || t > 40) return;
    st.temp = t;
    st.startMs = Date.now();
    save(); render();
  });
  $('resetBtn').addEventListener('click', function(){ st.startMs = null; save(); render(); });

  render();
  setInterval(render, 30000);
})();
</script>
</body>
</html>
